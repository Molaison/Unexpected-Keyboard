name: Validate upstream and nine-key integration
on:
  push:
    branches: [enhancement/upstream-t9-suggestions-20261005]
    paths: [.github/workflows/prepare-integration.yml]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Assemble the identical reviewed and built source tree
        run: |
          cp tools/.integration/resolve_merge.py "$RUNNER_TEMP/resolve_merge.py"
          cp tools/.integration/export_tree.py "$RUNNER_TEMP/export_tree.py"
          cp tools/.integration/followup.patch "$RUNNER_TEMP/followup.patch"
          cat tools/.integration/features.part* | gzip -dc > "$RUNNER_TEMP/features.patch"
          echo "b0982d1f38efc64fc70a91184943837a378bd25e75ffd5010e61d588f2c6c91f  $RUNNER_TEMP/features.patch" | sha256sum -c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/Julow/Unexpected-Keyboard.git 41249cd63701e70f291bf5fe65d0d52a6efeaafe
          git merge --no-commit --no-ff 41249cd63701e70f291bf5fe65d0d52a6efeaafe || test "$(git diff --name-only --diff-filter=U | wc -l)" -eq 6
          python3 "$RUNNER_TEMP/resolve_merge.py"
          git apply "$RUNNER_TEMP/features.patch"
          git apply "$RUNNER_TEMP/followup.patch"
          git rm -r tools/.integration .github/workflows/prepare-integration.yml
          git add -u
          git add srcs test doc androidTest res check_layout.output tools
          git diff --cached --check
          git commit -m 'Merge reviewed upstream and implement Chinese nine-key and ranked suggestions'
          test "$(git rev-parse HEAD^{tree})" = e654a5dd0bc720b02cee7bb4226609882b1d2762
          mkdir -p build/validation
      - name: Retrieve APK and passing build results for exactly this source tree
        uses: actions/download-artifact@v4
        with:
          name: nine-key-validation
          path: build
          run-id: 37315482907
          github-token: ${{ github.token }}
      - name: Export source objects for authorized connector publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/export_tree.py"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual IME with touch events
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ready=false; for attempt in $(seq 1 45); do adb -s emulator-5554 shell cmd overlay list --user 0 > build/validation/boot-overlays.txt; if grep -q '^\[x\] com.android.systemui:neutral' build/validation/boot-overlays.txt && grep -q '^\[x\] com.android.systemui:accent' build/validation/boot-overlays.txt; then ready=true; break; fi; sleep 2; done; test "$ready" = true
            sleep 5
            bash tools/run-pinyin-instrumentation.sh emulator-5554
      - name: Upload test evidence and installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-key-validation
          path: |
            build/validation/
            build/outputs/apk/debug/*.apk
            build/outputs/apk/androidTest/debug/*.apk
            build/reports/tests/
          retention-days: 7
          if-no-files-found: warn
