name: Keyboard UX validation
on:
  push:
    branches: [enhancement/clipboard-pinyin-ux-20261005]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Retrieve pinned Rime Ice sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/lexicon-source
          base=https://raw.githubusercontent.com/iDvel/rime-ice/59fcb4a6bfa71e6ba4fc83af07ee55f0c5b76081
          for file in base.dict.yaml ext.dict.yaml 8105.dict.yaml; do
            curl --fail --retry 2 --location "$base/cn_dicts/$file" -o "build/lexicon-source/$file"
          done
          sha256sum build/lexicon-source/*.yaml > build/lexicon-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ux-lexicon-source
          path: build/lexicon-source/
          retention-days: 3
