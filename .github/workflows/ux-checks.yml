name: Keyboard UX checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'srcs/**'
      - 'res/**'
      - 'assets/pinyin/**'
      - 'test/**'
      - 'androidTest/**'
      - 'tools/run-pinyin-instrumentation.sh'
      - '.github/workflows/ux-checks.yml'
permissions:
  contents: read
jobs:
  android-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
      - name: Build and verify production input engines
        run: |
          set -euo pipefail
          mkdir -p build/validation
          bash test/native/run-pinyin-tests.sh 2>&1 | tee build/validation/native.log
          gradle checkKeyboardLayouts testDebugUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee build/validation/gradle.log
          git diff --exit-code
          git rev-parse 'HEAD^{tree}' > build/validation/source-tree.txt
          sha256sum build/outputs/apk/debug/*.apk > build/validation/SHA256SUMS
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Touch, text, clipboard and theme acceptance
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            sleep 20
            bash tools/run-pinyin-instrumentation.sh emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-ux-evidence
          path: |
            build/validation/
            build/reports/tests/
            build/outputs/apk/debug/*.apk
          retention-days: 14
